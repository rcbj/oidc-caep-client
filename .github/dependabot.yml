# Version updates, weekly, as pull requests into develop (the branch work lands on).
# Security updates are on in the repository settings and open against main.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/tools/apidocs"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
