services:
  caep-demo:
    build: .
    image: oidc-caep-demo
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      # URL the browser uses to reach the app; the redirect URI is ${PUBLIC_URL}/callback.
      # The OIDC client runs in the browser: configure the identity provider on the app's front page.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    stop_grace_period: 5s
