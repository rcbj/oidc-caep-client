services:
  caep-demo:
    build: .
    image: oidc-caep-demo
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      # URL the browser uses. Empty means the server derives http://localhost:$PORT.
      # The redirect URI is that origin plus /callback.
      PORT: ${PORT:-3000}
      PUBLIC_URL: ${PUBLIC_URL-}
    stop_grace_period: 5s
